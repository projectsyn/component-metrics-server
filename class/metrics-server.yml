parameters:
  kapitan:
    dependencies:
      - type: helm
        source: ${metrics_server:charts:metrics-server:source}
        chart_name: metrics-server
        version: ${metrics_server:charts:metrics-server:version}
        output_path: ${_base_directory}/helmcharts/metrics-server/${metrics_server:charts:metrics-server:version}/
    compile:
      - input_paths:
          - ${_base_directory}/component/app.jsonnet
        input_type: jsonnet
        output_path: .
      - input_paths:
          - ${_base_directory}/component/main.jsonnet
        input_type: jsonnet
        output_path: ${_instance}/
      - output_path: metrics-server/01_helmchart
        input_type: helm
        input_paths:
          - ${_base_directory}/helmcharts/metrics-server/${metrics_server:charts:metrics-server:version}
        helm_values: ${metrics_server:helm_values}
        helm_params:
          release_name: metrics-server
          namespace: ${metrics_server:namespace}
