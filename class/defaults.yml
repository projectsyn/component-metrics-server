parameters:
  metrics_server:
    =_metadata:
      multi_tenant: true

    namespace: syn-metrics-server

    charts:
      metrics-server:
        source: https://kubernetes-sigs.github.io/metrics-server
        version: '3.14.0'

    images:
      metrics_server:
        registry: registry.k8s.io
        repository: metrics-server/metrics-server
        tag: v0.9.0

    helm_values:
      image:
        repository: ${metrics_server:images:metrics_server:registry}/${metrics_server:images:metrics_server:repository}
        tag: ${metrics_server:images:metrics_server:tag}
